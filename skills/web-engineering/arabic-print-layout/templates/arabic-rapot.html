<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Arabic Report Card Template</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    /* KFGQPC Uthman Taha Naskh — self-hosted */
    @font-face {
      font-family: 'KFGQPC Uthman Taha Naskh';
      src: url('/fonts/UthmanTN.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f3f4f6;
        color: black;
    }
    
    /* Typography tiers */
    .ft-tnr   { font-family: 'Times New Roman', serif; font-size: 14pt; }
    .ft-uth-18 { font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif; font-size: 18pt; font-weight: bold; }
    .ft-uth-16 { font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif; font-size: 16pt; }
    
    @media print {
        body { margin: 0; padding: 0; background-color: white; }
        
        main, #rapot-wrap, #print-area { 
            padding: 0 !important; 
            margin: 0 !important; 
            overflow: visible !important; 
        }
        
        .rapot-sheet {
            page-break-after: always;
            page-break-inside: avoid;
            break-inside: avoid;
            margin: 0 !important;
            padding: 0 !important;
            max-width: 100% !important;
            width: auto !important;
            min-height: 270mm !important;
        }
        
        .rapot-sheet:last-child { page-break-after: auto; }
    }
    
    /* F4 paper with margins: top 2.5cm, left/right 1.5cm, bottom 2cm */
    .rapot-sheet {
        font-family: 'Times New Roman', serif;
        width: 215.9mm;
        min-height: 330.2mm;
        margin: 0 auto 30px auto;
        padding: 2.5cm 1.5cm 2cm 1.5cm;
        background-color: white;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }
    
    /* Header logo sizing */
    .header-logo {
        width: 3cm;
        height: 3cm;
        object-fit: contain;
    }
    
    /* Student data identity block */
    .student-data {
        display: flex;
        justify-content: space-between;
        gap: 12mm;
        margin-bottom: 8px;
        font-family: 'Times New Roman', serif;
        font-size: 14pt;
        line-height: 1.25;
    }
    
    .student-data p {
        display: flex;
        align-items: baseline;
        margin-bottom: 1px;
    }
    
    .student-data .lbl {
        flex-shrink: 0;
        width: 100px;
    }
    
    .student-data .colon {
        margin-right: 8px;
    }
    
    .student-data .val {
        flex: 1;
        min-width: 20mm;
        font-weight: normal;
    }
    
    /* Table styling */
    .rapot-sheet table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.6cm !important;
    }
    
    .rapot-sheet th, .rapot-sheet td {
        border: 2px solid black;
        padding: 1px 8px 3px 6px;
        line-height: 1.1;
        text-align: center;
    }
    
    .rapot-sheet th {
        font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif;
        font-size: 16pt;
        font-weight: bold;
        background-color: #f8f9fa !important;
        -webkit-print-color-adjust: exact;
    }
    
    .rapot-sheet td {
        font-family: 'Times New Roman', serif;
        font-size: 14pt;
    }
    
    .rapot-sheet td.td-arab {
        font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif;
        font-size: 16pt;
    }
    
    .rapot-sheet td.td-num {
        font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif;
        font-size: 14pt;
        font-weight: bold;
    }
    
    .rapot-sheet tfoot th {
        font-family: 'KFGQPC Uthman Taha Naskh','Amiri',serif;
        font-size: 18pt;
        font-weight: bold;
        padding: 1px 6px 4px 6px;
    }
    
    .td-left {
        text-align: right;
    }
    
    /* Signature box footer pinning */
    .signature-box {
        display: flex;
        justify-content: space-between;
        padding: 0 40px;
        page-break-inside: avoid;
        break-inside: avoid;
        margin-top: 8px !important;
    }
    
    .signature-box p {
        margin: 0;
    }
    
    .signature-box .ft-tnr {
        border-bottom: 2px solid #000;
        padding-bottom: 2px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900">
  <main class="md:ml-64 min-h-screen pb-24 md:pb-8">
    <div id="rapot-wrap" class="p-4 md:p-8">
      <div id="print-area" class="overflow-x-auto print:overflow-visible"></div>
    </div>
  </main>
  
  <!-- TEMPLATE SHEET -->
  <template id="rapot-template">
    <div class="rapot-sheet" dir="rtl">
      <!-- HEADER -->
      <div class="flex items-center pb-2 mb-2 text-biru">
          <div class="header-logo"></div>
          <div class="header-text" style="line-height: 1.3;">
              <p class="hdr-1">كشف الدرجات الدراسية</p>
              <h1 data-field="semester-title" style="font-size: 18pt; margin: 2px 0;">فصل الدراسة الثانية</h1>
              <h2 data-field="madrasah-line" style="font-size: 16pt; margin: 2px 0;">المدرسة الابتدائية للبنات هداية المبتدئات ليربيا كديري</h2>
          </div>
          <img src="/logo-raport-bw-v5.png" alt="Logo Raport BW" class="header-logo" onerror="this.src='/logo-raport-bw-v4.png'">
      </div>
      
      <hr style="border:none;height:1px;background-color:#000;margin:6px auto;width:90%;">
      
      <div class="text-center mb-4 text-biru">
          <p class="hdr-tahun">سنة : <span data-field="tahun-ajaran">١٤٤٧ - ١٤٤٨ هـ / ٢٠٢٦ - ٢٠٢٧ م</span></p>
      </div>
  
      <!-- STUDENT DATA -->
      <div class="student-data text-hijau" dir="ltr">
          <div class="student-col">
              <p><span class="lbl">Nama</span>: <strong data-field="nama">....................</strong></p>
              <p><span class="lbl">No. Stambuk</span>: <strong data-field="stambuk">....................</strong></p>
              <p><span class="lbl">Kelas</span>: <strong data-field="kelas">....................</strong></p>
          </div>
          <div class="student-col">
              <p><span class="lbl">No. Tamrin</span>: <strong data-field="tamrin">....................</strong></p>
              <p><span class="lbl">Bagian</span>: <strong data-field="bagian">....................</strong></p>
          </div>
      </div>
  
      <!-- GRADES TABLE -->
      <table>
          <thead class="text-orange">
              <tr>
                  <th rowspan="2" style="width: 50px;">النمرة</th>
                  <th rowspan="2">الكتب الدراسية</th>
                  <th rowspan="2">الفنون</th>
                  <th colspan="2" style="white-space: nowrap; font-size: 16pt;">أرقام الدرجات الخاصة والعامة</th>
              </tr>
              <tr>
                  <th style="width: 80px;">الخاصة</th>
                  <th style="width: 80px;">العامة</th>
              </tr>
          </thead>
          
          <tbody data-field="tbody" class="text-biru"></tbody>
          
          <tfoot>
              <!-- Total Row -->
              <tr class="text-orange">
                  <th colspan="3" style="text-align: center;">جملة أرقام الدرجات الدراسية</th>
                  <td class="text-hijau" data-field="total-khos">0</td>
                  <td class="text-hijau" data-field="total-am">0</td>
              </tr>
              
              <!-- Absen Izin & Alfa -->
              <tr>
                  <th rowspan="2" colspan="2">أيّام التأخّر</th>
                  <td class="text-biru" style="font-weight:bold; text-align:center;">بإذن</td>
                  <td class="text-hijau" data-field="absen-izin">0</td>
                  <td class="text-hijau">-</td>
              </tr>
              <tr>
                  <td class="text-biru" style="font-weight:bold; text-align:center;">بغيره</td>
                  <td class="text-hijau" data-field="absen-alfa">0</td>
                  <td class="text-hijau">-</td>
              </tr>
              
              <!-- Bayan/Decision -->
              <tr data-field="bayan-box" style="display:none;">
                  <th colspan="2" style="font-weight:bold; text-align:center;">البيان</th>
                  <td colspan="3" data-field="bayan-value" style="text-align:right; padding-right:20px;">-</td>
              </tr>
          </tfoot>
      </table>
  
      <!-- SIGNATURES -->
      <div class="signature-box" dir="ltr">
          <div class="text-center" data-field="sig-mudir" style="display: none;">
              <p class="text-biru">المدير</p>
              <img data-field="sig-mudir-ttd" src="" alt="" style="display:none; max-height:48px; margin:2px auto 0;">
              <div data-field="sig-mudir-space" style="height:36px;"></div>
              <p class="text-orange">(<span data-field="sig-mudir-nama">.........................</span>)</p>
          </div>
          <div class="text-center">
              <p class="text-biru">المدرس</p>
              <div style="height:36px;"></div>
              <p class="text-orange">(<span data-field="sig-mudarris-nama">.........................</span>)</p>
          </div>
      </div>
    </div>
  </template>
</body>
</html>
